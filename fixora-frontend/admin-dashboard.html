<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixora | Admin Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header" id="page-header"></div>
      <div class="stats" id="stats"></div>

      <div class="columns">
        <section class="card col-main">
          <div class="card-row"><h2>Recent complaints</h2></div>
          <table id="complaints-table"></table>
        </section>

        <div class="col-side">
          <section class="card">
            <h2>Complaints by category</h2>
            <div id="category-bars"></div>
          </section>
          <section class="card">
            <h2>Recurring problems</h2>
            <ul id="recurring" class="muted"></ul>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    requireLogin('admin');
    renderSidebar('admin-dashboard.html');
    renderHeader('Admin Dashboard', 'Overview of campus complaints and maintenance');

    (async () => {
      const complaints = await api.getComplaints();

      // Top stat cards
      renderStats(document.getElementById('stats'), [
        { label: 'Pending',     value: countBy(complaints, 'status', 'Pending') },
        { label: 'In progress', value: countBy(complaints, 'status', 'In progress'), color: '#1e40af' },
        { label: 'Resolved',    value: countBy(complaints, 'status', 'Resolved'),    color: '#166534' },
        { label: 'High priority', value: countBy(complaints, 'priority', 'High'),    color: '#991b1b' },
      ]);

      // Newest 6 complaints
      const recent = [...complaints].sort((a, b) => b.id.localeCompare(a.id)).slice(0, 6);
      renderComplaintsTable(document.getElementById('complaints-table'), recent);

      // Category bars (width = share of the biggest category)
      const counts = CATEGORIES.map(name => ({ name, total: countBy(complaints, 'category', name) }))
                               .filter(c => c.total > 0);
      const biggest = Math.max(...counts.map(c => c.total));
      document.getElementById('category-bars').innerHTML = counts.map(c => `
        <div class="bar-row"><span>${esc(c.name)}</span>
        <div class="bar"><div style="width:${(c.total / biggest) * 100}%"></div></div>
        <b>${c.total}</b></div>`).join('');

      // Recurring problems
      const recurring = await api.getRecurringIssues();
      document.getElementById('recurring').innerHTML = recurring.map(r => `<li>${esc(r)}</li>`).join('');
    })();
  </script>
</body>
</html>
